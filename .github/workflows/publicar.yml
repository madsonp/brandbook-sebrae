name: Verificar e publicar

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar integridade e links
        run: python scripts/verificar.py
      - name: Gerar pacotes
        run: python scripts/gerar-pacotes.py
      - uses: actions/upload-artifact@v4
        with:
          name: pacotes
          path: dist/*.zip
      - name: Publicar versão
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.zip \
            --title "Brandbook Sebrae 2026, adaptação $GITHUB_REF_NAME" \
            --notes-file distribuicao/notas-da-versao.md

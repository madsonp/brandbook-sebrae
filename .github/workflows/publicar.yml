name: Verificar e publicar

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar integridade e links
        run: python scripts/verificar.py
      - name: Conferir tokens com os dados
        run: |
          python scripts/gerar-tokens.py
          git diff --exit-code tokens/ || (echo "Tokens desatualizados: execute python scripts/gerar-tokens.py" && exit 1)
      - name: Gerar pacotes
        run: python scripts/gerar-pacotes.py
      - uses: actions/upload-artifact@v4
        with:
          name: pacotes
          path: dist/*.zip
      - name: Publicar versão
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao="v$(tr -d '[:space:]' < distribuicao/VERSAO)"
          if gh release view "$versao" >/dev/null 2>&1; then
            echo "Versão $versao já publicada; nada a fazer."
          else
            gh release create "$versao" dist/*.zip \
              --target "$GITHUB_SHA" \
              --title "Brandbook Sebrae 2026, adaptação $versao" \
              --notes-file distribuicao/notas-da-versao.md
          fi
